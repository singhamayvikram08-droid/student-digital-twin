# ==============================================================================
# RENDER BLUEPRINT (INFRASTRUCTURE AS CODE)
# Student AI Digital Twin - Production Deployment Specification
# ==============================================================================
# When this repository is connected to Render (https://dashboard.render.com),
# Render automatically discovers this file and sets up both the Next.js frontend
# and the FastAPI backend with one click.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Next.js Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: student-digital-twin
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      # Set this in your Render dashboard environment settings to point to your deployed backend
      # e.g., https://student-digital-twin-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # ----------------------------------------------------------------------------
  # 2. FastAPI Python AI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: student-digital-twin-api
    runtime: python
    plan: free
    region: oregon
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
